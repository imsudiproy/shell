name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            arch: amd64
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
          - os: macos-15
            os_name: macos
            arch: amd64
          - os: macos-14
            os_name: macos
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package binary
        shell: bash
        run: |
          mkdir dist
          cp build/shell dist/shell
          tar -C dist -czf shell-${{ inputs.tag }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz shell

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: shell-${{ matrix.os_name }}-${{ matrix.arch }}
          path: shell-${{ inputs.tag }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" release-assets/*.tar.gz --target "$GITHUB_SHA" --generate-notes
